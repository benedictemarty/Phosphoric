# V2-E7 (US7.4) — Linux continuous integration: the full suite, both
# builds (SDL2=0/1), the CPU oracle (Dormann + a 65x02 sample), the performance
# budget and Valgrind on the core suites.
#
# ROMs are not versioned (*.rom ignored): the tests that depend on them
# SKIP themselves; the CI therefore validates the core (CPU, master
# clock, VIA, ULA, PSG, savestate, FDC on synthetic images), not the BASIC
# boot — the performance budget (which boots the ROM) therefore SKIPs here;
# BENCH_STRICT and the raised ceiling would only matter if a ROM were provided
# to the runner (a shared runner is not the reference machine).
name: linux-ci

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/linux-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2, Valgrind, Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config valgrind python3

      - name: Toolchain info
        run: |
          cc --version | head -1
          make --version | head -1
          pkg-config --modversion sdl2

      # Oracle vectors: Dormann in full (~150 KB) and a 65x02 sample
      # of opcodes where the historical core differs from the micro-sequenced one
      # (indexing dummy accesses, RMW write-back, stack, BRK/RTI, branches)
      # — enough for `make test-cycle` to decide, without the full GB set.
      - name: Fetch oracle vectors (Dormann + 65x02 sample)
        run: |
          tools/fetch_vectors.sh dormann
          tools/fetch_vectors.sh 65x02 a9 7d 9d fe b1 91 20 60 00 40 48 68 d0 f0 4c 6c 95 e6 3e 1e

      - name: Build headless (SDL2=0)
        run: make clean && make SDL2=0 -j4

      - name: Build with SDL2 (default)
        run: make clean && make -j4

      # Full suite; also fails if a test is skipped without an allowed reason
      # (tests/allowed_skips.txt). Objects are kept per configuration in build/:
      # no more SDL2=0/1 mixing between steps.
      - name: Run test suite (strict skips)
        run: make tests-strict

      - name: CPU oracle (cycle-by-cycle) and Dormann
        run: |
          make test-cycle CYCLE_MAX_CASES=0
          make test-dormann

      # Performance budget: forced verdict (BENCH_STRICT), ceiling raised to
      # 2000 µs (10 % of the frame) for a shared runner — the reference
      # figure (≤ 1000 µs) is read on the reference machine.
      - name: Performance budget
        run: BENCH_STRICT=1 BENCH_BUDGET_US=2000 make test-bench

      - name: Valgrind (core suites)
        run: make valgrind-core

  # Sprint E: the same suite under AddressSanitizer + UndefinedBehaviorSanitizer
  # (any UBSan error stops the test), then fuzzing of the file readers
  # (.dsk, .tap, .ost, .mid, symbols, phosphoric.cfg) with libFuzzer.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2, clang/libFuzzer, Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config python3 clang libclang-rt-dev

      - name: Fetch oracle vectors (Dormann + 65x02 sample)
        run: |
          tools/fetch_vectors.sh dormann
          tools/fetch_vectors.sh 65x02 a9 7d 9d fe b1 91 20 60 00 40 48 68 d0 f0 4c 6c 95 e6 3e 1e

      - name: Test suite under ASan + UBSan (strict skips)
        run: make SANITIZE=1 tests-strict

      - name: Fuzzing (libFuzzer, 30 s per target)
        run: make fuzz FUZZ_TIME=30

      - name: Keep failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/
          if-no-files-found: ignore
