# Native macOS build + tests (Apple clang + Homebrew SDL2) on a macos-latest runner.
# Validates macOS portability (PTY <util.h>, HAS_COM, MSG_NOSIGNAL, SDL2 sdl2-config).
name: macos-build

on:
  push:
    branches: [main, feature/macos-support]
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 + modern bash (Homebrew)
        # bash: macOS only ships bash 3.2 (2007); the integration test scripts
        # target modern bash (like the Linux CI on bash 5.x).
        # Homebrew puts it first in PATH (/opt/homebrew/bin).
        run: brew install sdl2 pkg-config bash

      - name: Toolchain info
        run: |
          cc --version
          make --version | head -1
          pkg-config --modversion sdl2 || sdl2-config --version

      # Headless build first: isolates the core (no SDL2) — checks PTY/COM/
      # MSG_NOSIGNAL without depending on the graphics layer.
      - name: Build headless (SDL2=0)
        run: make clean && make SDL2=0 -j3

      # Full build with SDL2 (Homebrew): checks the Makefile's pkg-config
      # detection / sdl2-config fallback.
      - name: Build with SDL2 (Homebrew)
        run: make clean && make SDL2=1 -j3

      # Full test suite (must be green, as on Linux/Windows).
      - name: Run test suite
        run: make tests

      # Optional network builds: validate the MSG_NOSIGNAL fallback on macOS
      # (http_api.c / cast_server.c include oscompat.h).
      - name: Build HTTPAPI=1 (MSG_NOSIGNAL fallback)
        run: make clean && make SDL2=1 HTTPAPI=1 -j3
